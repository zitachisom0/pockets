<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <title>Login</title>
    </head>

    <!-- BODY -->
     <body class="login_page">
         <div  class="page">
            <div class="login_section">
                <!-- FIRST SECTION -->
                <div class="first_section">
                    <h1 class="title">
                        Pocket
                    </h1>
                    <div class="intro_text">
                            <h1>Banking that fits in your pocket.</h1>
                            <p class="description">Login to send money, pay bills and keep an eye on your spending.</p>
                    </div>                   
                    <div class="customer_image_container2">
                    </div>
                </div>

                <!-- SECOND SECTION -->
                <div class="second_section">
                    <div class="second_section_content">
                        <h1 class="welcome_text">
                            Welcome back
                        </h1>
                        <p class="enter_text">
                            Enter your details to login
                        </p>

                        <!-- EMAIL INPUT -->
                        <div class="email_section">
                            <p class="email_text">
                                Email Address
                            </p>
                            <!-- <a href="Email" class="email_input"> -->
                                <input  placeholder="you@example.com" class="email_input"/>
                            <!-- </a> -->
                        </div>

                        <!-- PASSWORD INPUT -->
                        <div class="password_section">
                            <p class="password_text">
                                Password
                            </p>
                            <!-- <a href="Password" class="password_input"> -->
                                <input  placeholder="Enter your password" class="password_input"/>
                            <!-- </a> -->
                        </div>

                        <!-- FORGOT PASSWORD -->
                        <div class="forgot_password">
                            <div class="remember_me">
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember" class="remember_label">Remember me</label>
                            </div>                            
                            <label class="forgot_label">
                                Forgot password?
                            </label>
                        </div>

                        <!-- BUTTON -->
                        <a href="login" class="login_button btn">Log In</a>

                        <!-- BOXVIEW -->
                        <div class="divider">
                            <span class="divider_line"></span>
                            <span class="divider_text">or</span>
                            <span class="divider_line"></span>
                        </div>                

                        <!-- CREATE AN ACCT -->
                        <div class="create_section">
                            <label class="new_text">
                                New to Pocket?
                            </label>
                            <a href="create" class="create_text">
                                Create an account
                            </a>
                        </div>
                    </div>
                </div>
            </div>
         </div>
     </body>
</html>
